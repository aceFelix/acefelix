# AceFelix 知识图谱 CI
#
# push/PR 到 main 时自动执行：
#   - 后端：安装依赖 → 生成种子数据 → 语法检查 → 单元测试
#   - 前端：npm ci → vite build 构建验证
#
# 说明：backend/data/graph.json 为本地个人数据不入库，CI 中先运行
# seed.py 生成种子数据，保证 test_mcp_server.py 可跑通。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate seed data
        run: python seed.py

      - name: Syntax check
        run: python -m compileall -q .

      - name: Run tests
        run: |
          python test_mcp_server.py
          # 抽取管线测试：LLM 全 mock，无需 API Key；覆盖五道防噪闸与查重（含闲聊零写入负例）
          python test_ingest.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
